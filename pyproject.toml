[project]
name = "local-agent"
version = "0.1.0"
description = "Terminal AI agent using Ollama and MCP filesystem tools"
readme = "README.md"
authors = [
    { name = "ratanakvicheasok26-creator", email = "ratanakvichea.sok26@kit.edu.kh" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=2.3.0",
]

[project.scripts]
local-agent = "local_agent.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
